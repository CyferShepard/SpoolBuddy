name: Build

# Every push and pull request builds and tests the app. A tag like v1.2.0
# also publishes a GitHub release with the signed APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pushing main and a tag together starts two runs for the same commit.
  # The branch run stops here and leaves the build to the tag run.
  gate:
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.check.outputs.tagged }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]] &&
             git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'v*' |
             grep -q "^${GITHUB_SHA}"; then
            tagged=true
            echo "::notice::This commit is tagged, so the tag's run builds it."
          fi
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    env:
      # Repository secrets (Settings → Secrets and variables → Actions).
      # Pull requests from forks don't get secrets, so they build debug-signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Warn about debug signing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing key in secrets, so this APK is signed with a debug key and can't update a release install."

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/spoolbuddy-${{ steps.version.outputs.name }}.apk"

      - name: Show signing certificate
        run: |
          # Newer build-tools can need a newer Java than the build's; try each until one runs.
          for bt in $(ls -d "$ANDROID_HOME"/build-tools/* | sort -rV); do
            if out="$("$bt/apksigner" verify --print-certs dist/*.apk 2>&1)"; then
              echo "$out" | grep -E 'certificate (DN|SHA-256 digest):' || echo "$out"
              exit 0
            fi
            echo "apksigner $(basename "$bt") didn't run: $(echo "$out" | head -1)"
          done
          echo "::warning::Couldn't check the APK's signing certificate"

      - name: Remove signing key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: spoolbuddy-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spoolbuddy-${{ needs.build.outputs.version }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
